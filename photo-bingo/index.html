<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e7a" />
  <title>Special Day Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Kalam:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <svg class="hero-sky" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g fill="currentColor" opacity=".55">
          <path d="M0 150v-26c18-14 34-14 52 0s34 14 52 0 34-14 52 0V150Z"/>
          <path d="M290 150V92h8V74l-6-4 14-24 14 24-6 4v18h8V60l-5-4 13-30 13 30-5 4v32h8V76l-6-4 14-24 14 24-6 4v74Z"/>
          <path d="M330 26v-14l14 5-14 5" />
        </g>
        <g fill="none" stroke="currentColor" stroke-width="2.5" opacity=".45">
          <path d="M150 150c20-40 40-60 60-40s30 30 50 10"/>
          <path d="M160 150v-24M180 150v-40M200 150v-46M220 150v-36M240 150v-24"/>
        </g>
      </svg>
      <p class="hero-script">Let's<br/>Enjoy!</p>
      <p class="hero-kicker">SPECIAL DAY</p>
      <h1 class="hero-title">BINGO</h1>
      <p class="hero-sub" id="subtitle"></p>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <span class="foot-script">Good Memories</span>
      <p>写真はこの端末のブラウザ内だけに保存されます</p>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="missions.js"></script>
  <script src="app.js"></script>
</body>
</html>
