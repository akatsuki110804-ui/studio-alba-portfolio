# YouTube制作 AI社員チーム — 役割インデックス（機械可読）
# 状態: 下書き（ユーザー回答待ち）。人が読む説明は roles/*.md、境界は overlaps.md を参照。
# upstream/downstream の user はユーザー本人。implemented_by のパスはリポジトリ直下からの相対パス。

version: 0.1-draft
status: 下書き（ユーザー回答待ち）
channel: AIでつくる、27歳の記録     # シリーズ「What If Lab」を含む
deliverables: [長尺動画, Shorts]   # Shortsは長尺からの派生が多い
video_folder: videos/<YYYYMMDD>_<slug>/
publishing:
  default: manual               # ユーザーがYouTube Studioで手動アップロード・公開
  api_upload: not_configured    # YouTube Data API（Google Cloudプロジェクト＋OAuth同意画面）はユーザーの設定と承認が済むまで使わない
  api_upload_privacy: [private, scheduled]   # 設定後も非公開 or 予約公開でアップロードし、最終公開はG4で承認
phases: [リサーチ, 企画, 台本, レビュー, 素材準備, 編集, 品質確認, 投稿, 分析, 改善, 進行]
approval_gates:
  - {id: G1, name: 企画の承認, owner: R07}
  - {id: G2, name: 台本の承認, owner: R13}
  - {id: G3, name: 費用がかかる生成の前, owner: [R17, R21]}
  - {id: G4, name: 投稿の前, owner: R23, note: アップロード（API時）と最終公開の両方}

